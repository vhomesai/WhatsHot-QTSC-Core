name: triqee-production

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      TRIQEE_ADMIN_KEY: "${TRIQEE_ADMIN_KEY:?TRIQEE_ADMIN_KEY must be set in the deployment environment}"
      TRIQEE_CORS_ORIGINS: "https://www.triqee.com"
      TRIQEE_DB_PATH: "/app/data/operational.db"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - triqee_data:/app/data
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  caddy:
    image: caddy:2.10.2-alpine
    user: "1000:1000"
    environment:
      TRIQEE_SITE_ADDRESS: "${TRIQEE_SITE_ADDRESS:-www.triqee.com}"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=1000,gid=1000
      - /config:rw,noexec,nosuid,nodev,size=16m,uid=1000,gid=1000
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./triqee_si_chatbot.html:/srv/triqee_si_chatbot.html:ro
      - caddy_data:/data
    networks:
      - edge
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  edge:
  backend:
    internal: true

volumes:
  triqee_data:
  caddy_data:
