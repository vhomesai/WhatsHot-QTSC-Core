services:
  - type: web
    name: whatshot-qtsc-core
    runtime: python
    buildCommand: >-
      python -m pip install -r requirements.lock &&
      python -m pip install --no-deps . &&
      python -m compileall -q src &&
      python -c "import importlib.util; assert importlib.util.find_spec('src.api_server')"
    startCommand: uvicorn src.api_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: triqee-data
      mountPath: /opt/render/project/data
      sizeGB: 1
    envVars:
      - key: TRIQEE_ADMIN_KEY
        sync: false
      - key: TRIQEE_CORS_ORIGINS
        value: https://www.triqee.com
      - key: TRIQEE_DB_PATH
        value: /opt/render/project/data/triqee_system.db
