name: DAE RWA Evidence Tests

on:
  push:
    paths:
      - 'dae_tt002.py'
      - 'test_dae_tt002.py'
      - 'dae_rwa001.py'
      - 'test_dae_rwa001.py'
      - '.github/workflows/dae-tt-002.yml'
  pull_request:
    paths:
      - 'dae_tt002.py'
      - 'test_dae_tt002.py'
      - 'dae_rwa001.py'
      - 'test_dae_rwa001.py'
      - '.github/workflows/dae-tt-002.yml'

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Validate RWA evidence gates
        run: python -m unittest -v test_dae_tt002 test_dae_rwa001
